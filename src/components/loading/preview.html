<meta charset="utf-8" />
<title>RA — boot screen</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  @font-face {
    font-family: 'Angry';
    src: url('/fonts/Angry.woff2') format('woff2'), url('/fonts/Angry.otf') format('opentype'),
      url('/fonts/Angry.ttf') format('truetype');
    font-display: swap;
  }
  html, body { margin: 0; height: 100%; background: #070401; overflow: hidden; }
  #ra {
    --void: #070401;
    --p: 0;
    --ra-display: 'Angry', 'Arial Black', 'Helvetica Neue', Impact, sans-serif;
    --ra-mono: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, monospace;
    position: fixed; inset: 0; display: grid; place-items: center;
    background: var(--void); opacity: 1;
    transition: opacity 620ms cubic-bezier(.4,0,.2,1), transform 620ms cubic-bezier(.4,0,.2,1), filter 620ms cubic-bezier(.4,0,.2,1);
  }
  #ra[data-state='out'] { opacity: 0; transform: scale(1.05); filter: blur(8px); }
  .haze { position: absolute; inset: 0;
    background: radial-gradient(44vmin 44vmin at 50% 48%, rgba(250,138,22, calc(.04 + var(--p) * .07)), transparent 70%),
      radial-gradient(120vmin 90vmin at 50% 120%, rgba(122,59,2,.14), transparent 70%); }
  .vignette { position: absolute; inset: 0;
    background: radial-gradient(80vmin 80vmin at 50% 50%, transparent 30%, rgba(0,0,0,.78) 100%); }
  .dust { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none;
    -webkit-mask-image: radial-gradient(75vmax 75vmax at 50% 50%, #000 35%, transparent 92%);
    mask-image: radial-gradient(75vmax 75vmax at 50% 50%, #000 35%, transparent 92%); }
  #ra[data-state='out'] .dust { opacity: 0; transition: opacity 400ms ease; }
  .stage { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .scene { position: relative; width: min(460px, 88vw); height: min(460px, 88vw); }
  .canvas { position: absolute; inset: 0; animation: fadeIn 700ms ease both;
    -webkit-mask-image: radial-gradient(closest-side, #000 58%, transparent 97%);
    mask-image: radial-gradient(closest-side, #000 58%, transparent 97%); }
  .bloom { position: absolute; left: 50%; top: 50%; width: 62%; height: 62%; margin: -31% 0 0 -31%;
    border-radius: 50%; pointer-events: none;
    background: radial-gradient(circle, rgba(255,197,118,.42) 0%, rgba(250,138,22,.2) 32%, rgba(250,138,22,.06) 54%, transparent 74%);
    opacity: calc(.05 + var(--p) * var(--p) * .6);
    transform: translateZ(0) scale(calc(.7 + var(--p) * .26)); will-change: opacity, transform; }
  #ra[data-state='flash'] .bloom, #ra[data-state='out'] .bloom {
    opacity: 1; transform: translateZ(0) scale(1.4);
    transition: opacity 560ms cubic-bezier(.22,1,.36,1), transform 560ms cubic-bezier(.22,1,.36,1); }
  .meta { display: flex; align-items: baseline; gap: 14px;
    animation: rise 900ms cubic-bezier(.16,1,.3,1) 260ms both; }
  .label { font-family: var(--ra-display); font-size: 12px; letter-spacing: .28em;
    text-transform: uppercase; color: rgba(255,180,89,.4); }
  .percent { font-family: var(--ra-mono); font-size: 11px; letter-spacing: .16em;
    color: rgba(255,180,89,.8); font-variant-numeric: tabular-nums; min-width: 4ch; text-align: right; }
  @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  .replay { position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%); z-index: 10;
    padding: 9px 18px; border: 1px solid rgba(250,138,22,.28); border-radius: 999px;
    background: rgba(250,138,22,.06); color: #ffb459; font: 10px ui-monospace, monospace;
    letter-spacing: .2em; text-transform: uppercase; cursor: pointer; }
  .replay:hover { background: rgba(250,138,22,.14); }
</style>

<div id="ra" data-state="in">
  <div class="haze"></div>
  <div class="vignette"></div>
  <canvas class="dust" id="dust"></canvas>
  <div class="stage">
    <div class="scene">
      <div class="bloom"></div>
      <div class="canvas" id="scene"></div>
    </div>
    <div class="meta"><span class="label">Loading</span><span class="percent" id="pct">0%</span></div>
  </div>
</div>
<button class="replay" id="replay">Проиграть снова</button>

function bin(s) {

    out[i*3] = positions[v]; out[i*3+1] = positions[v+1]; out[i*3+2] = positions[v+2];
  }
  return out;
}

  geo.setAttribute('position', new THREE.BufferAttribute(tri, 3));
  geo.computeVertexNormals();

  const centroid = new Float32Array(count*9), scatter = new Float32Array(count*9),
        axis = new Float32Array(count*9), delay = new Float32Array(count*3);
  for (let f = 0; f < count; f++) {
    const o = f * 9;
    const cx = (tri[o] + tri[o+3] + tri[o+6]) / 3;
    const cy = (tri[o+1] + tri[o+4] + tri[o+7]) / 3;
    const cz = (tri[o+2] + tri[o+5] + tri[o+8]) / 3;

    // равномерно по сфере: (random - 0.5) по осям давал кубическое облако
    let dx = 0, dy = 0, dz = 0, l2 = 2;
    while (l2 > 1 || l2 < 1e-6) {
      dx = Math.random()*2 - 1; dy = Math.random()*2 - 1; dz = Math.random()*2 - 1;
      l2 = dx*dx + dy*dy + dz*dz;
    }
    const l = Math.sqrt(l2); dx /= l; dy /= l; dz /= l;

    const r = 0.55 + Math.cbrt(Math.random()) * 1.0;
    const len = Math.hypot(cx, cy) || 1;
    const sx = (dx*0.72 + (cx/len)*0.42) * r;
    const sy = (dy*0.72 + (cy/len)*0.42) * r;
    const sz = dz * r * 0.85;

    const ax = Math.random()-0.5, ay = Math.random()-0.5, az = Math.random()-0.5;
    const d = ((cx + 1) / 2) * 0.34 + Math.random() * 0.14;

    for (let k = 0; k < 3; k++) {
      const p = o + k*3;
      centroid[p]=cx; centroid[p+1]=cy; centroid[p+2]=cz;
      scatter[p]=sx; scatter[p+1]=sy; scatter[p+2]=sz;
      axis[p]=ax; axis[p+1]=ay; axis[p+2]=az;
      delay[f*3+k]=d;
    }
  }
  geo.setAttribute('aCentroid', new THREE.BufferAttribute(centroid, 3));
  geo.setAttribute('aScatter', new THREE.BufferAttribute(scatter, 3));
  geo.setAttribute('aAxis', new THREE.BufferAttribute(axis, 3));
  geo.setAttribute('aDelay', new THREE.BufferAttribute(delay, 1));

  const material = new THREE.ShaderMaterial({
    vertexShader: VERT, fragmentShader: FRAG, transparent: true, side: THREE.DoubleSide,
    uniforms: {
      uProgress: { value: 0 },
      uDark: { value: new THREE.Color('#4a1f02') },
      uMid: { value: new THREE.Color('#fa8a16') },
      uHot: { value: new THREE.Color('#ffd9a0') },
    },
  });

  const group = new THREE.Group();
  group.add(new THREE.Mesh(geo, material));
  sc.add(group);

  function resize() {
    const w = host.clientWidth || 1, h = host.clientHeight || 1;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.updateProjectionMatrix();
  }
  resize();
  new ResizeObserver(resize).observe(host);

  let p = 0;
  setProgress = (v) => { p = v; };
  const t0 = performance.now();
  (function loop(now) {
    const time = (now - t0) / 1000;
    material.uniforms.uProgress.value = p;
    const settle = 1 - Math.pow(1 - Math.min(p, 1), 3);
    group.rotation.y = (1 - settle) * -1.05 + Math.sin(time * 0.45) * 0.13 * settle;
    group.rotation.x = (1 - settle) * 0.4 + Math.sin(time * 0.33 + 1.2) * 0.06 * settle;
    group.position.z = (1 - settle) * -1.2;
    renderer.render(sc, camera);
    requestAnimationFrame(loop);
  })(t0);
})();

/* ---------- пыль ---------- */
(function dustField() {
  const canvas = document.getElementById('dust');
  const ctx = canvas.getContext('2d');
  const rand = (a, b) => a + Math.random() * (b - a);
  let w, h, motes;
  function build() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const rect = canvas.getBoundingClientRect();
    w = Math.max(1, rect.width); h = Math.max(1, rect.height);
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.round(Math.min(180, ((w * h) / 1e6) * 62));
    motes = Array.from({ length: count }, () => {
      const z = Math.random();
      return { x: Math.random()*w, y: Math.random()*h, r: rand(.35,.9)+z*1.5, z,
        vy: -(rand(2,7)+z*9)/60, sway: rand(6,22)*(.4+z),
        phase: Math.random()*Math.PI*2, twinkle: rand(.4,1.6) };
    });
  }
  function draw(t) {
    ctx.clearRect(0, 0, w, h);
    ctx.globalCompositeOperation = 'lighter';
    const boost = 0.75 + (window.__raP || 0) * 0.55;
    const time = t / 1000;
    for (const m of motes) {
      m.y += m.vy;
      if (m.y < -8) { m.y = h + 8; m.x = Math.random() * w; }
      const x = m.x + Math.sin(time * 0.28 + m.phase) * m.sway;
      const flicker = 0.62 + 0.38 * Math.sin(time * m.twinkle + m.phase);
      const alpha = (0.06 + m.z * 0.34) * flicker * boost;
      if (m.z > 0.55) {
        const g = ctx.createRadialGradient(x, m.y, 0, x, m.y, m.r * 5);
        g.addColorStop(0, 'rgba(255,214,130,' + alpha * 0.5 + ')');
        g.addColorStop(1, 'rgba(255,190,90,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, m.y, m.r * 5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.fillStyle = 'rgba(255,206,112,' + alpha + ')';
      ctx.beginPath(); ctx.arc(x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    requestAnimationFrame(draw);
  }
  build(); new ResizeObserver(build).observe(canvas); requestAnimationFrame(draw);
})();

/* ---------- прогресс ---------- */
const ra = document.getElementById('ra');
const pct = document.getElementById('pct');
let raf, v;

function run() {
  cancelAnimationFrame(raf);
  v = 0; ra.dataset.state = 'in';
  ra.style.setProperty('--p', 0); window.__raP = 0;
  pct.textContent = '0%'; setProgress(0);
  ra.querySelectorAll('.canvas, .meta').forEach((el) => {
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
  });

  const start = performance.now();
  let last = start;
  const tick = (now) => {
    const dt = Math.min(64, now - last); last = now;
    const e = now - start;
    const target = e > 3000 ? 100 : 92 * (1 - Math.exp(-e / 900));
    v += (target - v) * (1 - Math.exp(-dt / 170));
    if (v > 99.5) v = 100;
    ra.style.setProperty('--p', (v / 100).toFixed(4));
    window.__raP = v / 100;
    setProgress(v / 100);
    pct.textContent = Math.round(v) + '%';
    if (v < 100) raf = requestAnimationFrame(tick);
    else {
      ra.dataset.state = 'flash';
      setTimeout(() => (ra.dataset.state = 'out'), 520);
      setTimeout(run, 2400);
    }
  };
  raf = requestAnimationFrame(tick);
}
document.getElementById('replay').onclick = run;
run();
</script>
